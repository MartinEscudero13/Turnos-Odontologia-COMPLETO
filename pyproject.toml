[project]
name = "turnos-odontologia"
version = "0.1.0"
description = "SaaS multi-tenant de agenda odontológica"
requires-python = ">=3.12"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["docs", "node_modules", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ARG", "UP", "SIM"]
ignore = ["E501", "SIM108", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["backend", "."]
packages = ["app"]
strict = true
plugins = ["pydantic.mypy"]
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]
ignore_missing_imports = false
warn_unused_ignores = true
warn_return_any = true
