# Alembic configuration for Turnos-Odontologia.
# DATABASE_URL is read by alembic/env.py; never commit credentials here.
[alembic]
script_location = backend/alembic
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg://PLACEHOLDER:PLACEHOLDER@localhost:5432/PLACEHOLDER

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname).2s %(name)s: %(message)s
datefmt = %H:%M:%S
