name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  DATABASE_URL: postgresql+psycopg://turnos:test-password@localhost:5432/turnos
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET: test-secret-that-is-long-enough-for-local-dev-1234567890
  APP_URL: http://localhost:5173
  APP_NAME: turnos-api
  APP_VERSION: 0.1.0

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: turnos
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: turnos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U turnos -d turnos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Type-check
        run: python -m mypy --config-file pyproject.toml
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Migration graph
        run: python -m alembic -c backend/alembic.ini heads
      - name: Apply migrations to ephemeral database
        env:
          DATABASE_URL: postgresql+psycopg://turnos:test-password@localhost:5432/turnos
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Roll back migrations
        env:
          DATABASE_URL: postgresql+psycopg://turnos:test-password@localhost:5432/turnos
        run: python -m alembic -c backend/alembic.ini downgrade base
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet
      - name: Docker smoke test
        run: |
          docker compose -f docker-compose.yml up -d --build
          docker compose -f docker-compose.yml ps
          curl --fail --retry 10 --retry-delay 2 http://localhost:8000/api/health
          docker compose -f docker-compose.yml down -v
