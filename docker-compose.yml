name: turnos-odontologia

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: turnos_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definí POSTGRES_PASSWORD en .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?definí POSTGRES_APP_PASSWORD en .env}
      POSTGRES_DB: turnos
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos_owner -d turnos"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - turnos

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - turnos

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_OWNER_URL: postgresql+psycopg://turnos_owner:${POSTGRES_PASSWORD}@db:5432/turnos
      DEMO_PASSWORD: ${DEMO_PASSWORD:?definí DEMO_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "python -m alembic -c alembic.ini upgrade head && python seed_demo.py",
      ]
    networks:
      - turnos

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: development
      APP_NAME: turnos-api
      APP_VERSION: 0.1.0
      APP_URL: http://localhost:5173
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://turnos_app:${POSTGRES_APP_PASSWORD:?definí POSTGRES_APP_PASSWORD en .env}@db:5432/turnos
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?definí JWT_SECRET en .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - turnos

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - turnos

networks:
  turnos:
    driver: bridge

volumes:
  postgres-data:
